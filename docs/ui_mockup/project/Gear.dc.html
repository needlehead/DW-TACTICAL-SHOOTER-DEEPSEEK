<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet: Gear</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#93A3BC}a:hover{color:#E8ECF2}
</style>
</helmet>
<div style="width: 720px; height: 500px; box-sizing: border-box; background: {{c.ground}}; font-family: Barlow, sans-serif; color: {{c.text}}; display: flex; flex-direction: column">
  <div style="height: 48px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; background: {{c.header}}; display: flex; align-items: center; gap: 16px">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.04em; width: 168px">KEI FUJIWARA</span>
    <div style="display: flex; align-items: center; gap: 4px; flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.08em">
      <span style="color: {{c.dim}}; font-size: 13px; padding-right: 6px">Q</span>
      <span style="padding: 5px 9px; color: {{c.dim}}">STATUS</span>
      <span style="padding: 5px 9px; color: {{c.dim}}">OBJECTIVE</span>
      <span style="padding: 5px 9px; color: {{c.dim}}">RUN</span>
      <span style="padding: 5px 9px; background: {{c.main}}; color: {{c.onMain}}">GEAR</span>
      <span style="color: {{c.dim}}; font-size: 13px; padding-left: 6px">E</span>
    </div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px; color: {{c.dim}}; font-variant-numeric: tabular-nums">12:14</span>
  </div>
  <div style="flex-grow: 1; box-sizing: border-box; padding: 16px; display: flex; gap: 20px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px">
      <div style="padding: 10px 12px; background: {{c.card}}">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.03em">SUPPRESSED SMG</p><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.1em; color: {{c.accent}}">IN HAND</span></div>
        <p style="margin: 2px 0 0 0; font-weight: 500; font-size: 18px; color: {{c.soft}}">SEMI / BURST / AUTO · 5 spare mags</p>
      </div>
      <div style="padding: 10px 12px; background: {{c.card2}}">
        <p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.03em">RADIAN RIFLE</p>
        <p style="margin: 2px 0 0 0; font-weight: 500; font-size: 18px; color: {{c.soft}}">SEMI / AUTO · 4 spare mags</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-top: 4px">
        <div><p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.1em; color: {{c.dim}}">AMMO TYPE</p><p style="margin: 0; font-weight: 600; font-size: 22px; color: {{c.dash}}">—</p></div>
        <div><p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.1em; color: {{c.dim}}">GRENADES</p><p style="margin: 0; font-weight: 600; font-size: 22px">FRAG ×2</p></div>
      </div>
    </div>
    <div style="width: 220px; flex-shrink: 0; display: flex; flex-direction: column">
      <div style="position: relative; width: 220px; height: 306px; background: {{c.panel}}">
        <img src="{{outfit.src}}" alt="{{outfit.alt}}" style="width: 220px; height: 306px; object-fit: contain; object-position: bottom">
        <span style="position: absolute; left: 8px; top: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; color: {{c.dim}}">{{outfit.label}}</span>
      </div>
      <button type="button" onClick="{{rotate}}" style="height: 44px; margin-top: 8px; border: 1px solid {{c.line}}; background: {{c.card2}}; color: {{c.text}}; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.1em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px"><span style="padding: 1px 7px; background: {{c.main}}; color: {{c.onMain}}">R</span>ROTATE</button>
      <div style="margin-top: 8px"><p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.1em; color: {{c.dim}}">OUTFIT</p><p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.04em">HEAVY METAL</p></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"heroine":{"editor":"color","default":"#529364","section":"Heroine","options":["#529364","#B8564A","#4F78B8","#B58A2E"]},"$preview":{"width":720,"height":500}}'>
// Heroine theme: every tablet colour comes from the heroine's main colour, so a new heroine only needs one hex.
class Component extends DCLogic {
  renderVals() {
    function rgb(h) { h = String(h).replace('#', ''); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16) || 0; }); }
    function mix(a, b, t) { return a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }); }
    function css(c, a) { return a === undefined ? 'rgb(' + c.join(',') + ')' : 'rgba(' + c.join(',') + ',' + a + ')'; }
    function lum(c) { return c.reduce(function (s, v, i) { v /= 255; v = v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); return s + v * [0.2126, 0.7152, 0.0722][i]; }, 0); }
    function theme(hex) {
      var m = rgb(hex), K = [0, 0, 0], W = [255, 255, 255];
      var ground = mix(m, K, 0.87), dim = mix(m, W, 0.55);
      return {
        main: css(m), ground: css(ground), header: css(mix(m, K, 0.76)), panel: css(mix(m, K, 0.8)),
        text: css(mix(m, W, 0.92)), soft: css(mix(m, W, 0.72)), dim: css(dim), dash: css(mix(dim, ground, 0.35)),
        accent: css(mix(m, W, 0.25)), onMain: lum(m) > 0.18 ? css(mix(m, K, 0.9)) : '#FFFFFF',
        card: css(m, 0.24), card2: css(m, 0.08), line: css(m, 0.35)
      };
    }
    var back = this.state && this.state.back;
    var self = this;
    return {
      c: theme(this.props.heroine ?? '#529364'),
      outfit: back
        ? { src: '/_blob/affd9c6f7cf947e0ceba971ff75077c4', alt: 'Heavy Metal outfit, back view', label: 'BACK' }
        : { src: '/_blob/1c620ce8e2b63eb98684910d87b0b3f3', alt: 'Heavy Metal outfit, front view', label: 'FRONT' },
      rotate: function () { self.setState({ back: !back }); }
    };
  }
}
</script>
</body>
</html>
