<script type="text/x-dc" data-dc-script data-props='{"heroine":{"editor":"color","default":"#529364","section":"Heroine","options":["#529364","#B8564A","#4F78B8","#B58A2E"]},"$preview":{"width":720,"height":500}}'>
// Heroine theme: every tablet colour comes from the heroine's main colour, so a new heroine only needs one hex.
class Component extends DCLogic {
  renderVals() {
    function rgb(h) { h = String(h).replace('#', ''); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16) || 0; }); }
    function mix(a, b, t) { return a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }); }
    function css(c, a) { return a === undefined ? 'rgb(' + c.join(',') + ')' : 'rgba(' + c.join(',') + ',' + a + ')'; }
    function lum(c) { return c.reduce(function (s, v, i) { v /= 255; v = v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); return s + v * [0.2126, 0.7152, 0.0722][i]; }, 0); }
    function theme(hex) {
      var m = rgb(hex), K = [0, 0, 0], W = [255, 255, 255];
      var ground = mix(m, K, 0.87), dim = mix(m, W, 0.55);
      return {
        main: css(m), ground: css(ground), header: css(mix(m, K, 0.76)), panel: css(mix(m, K, 0.8)),
        text: css(mix(m, W, 0.92)), soft: css(mix(m, W, 0.72)), dim: css(dim), dash: css(mix(dim, ground, 0.35)),
        accent: css(mix(m, W, 0.25)), onMain: lum(m) > 0.18 ? css(mix(m, K, 0.9)) : '#FFFFFF',
        card: css(m, 0.24), card2: css(m, 0.08), line: css(m, 0.35)
      };
    }
    return { c: theme(this.props.heroine ?? '#529364') };
  }
}
